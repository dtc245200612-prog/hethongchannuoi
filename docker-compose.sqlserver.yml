services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set a strong MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - farm_ai_sqlserver:/var/opt/mssql
volumes:
  farm_ai_sqlserver:
